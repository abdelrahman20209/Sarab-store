<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>إتمام الطلب | سراب</title>
    <link rel="icon" type="image/png" href="img/LOGO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/store.css" />
  </head>
  <body>
    <main class="page">
      <div class="wrap">
        <div class="progress"><span class="done">1 · السلة</span><span class="on">2 · البيانات والفاتورة</span><span>3 · التحويل والتأكيد</span></div>
        <div class="page-head"><h1>بيانات التوصيل والفاتورة</h1></div>

        <form class="two" id="coForm" novalidate>
          <div>
            <div class="card">
              <h2><i class="fas fa-location-dot"></i> 1. منطقة التوصيل</h2>
              <div class="form">
                <label for="zone">اختَر منطقتك <em>*</em></label>
                <select id="zone" required><option value="">جاري تحميل المناطق...</option></select>
                <p class="note"><i class="fas fa-circle-info"></i><span><span data-t="zone_note"></span> <a class="link" data-wa data-wa-text="أهلاً، منطقتي مش موجودة في مناطق التوصيل وعايز أطلب." target="_blank" rel="noopener">تواصل مع الدعم</a></span></p>
                <label for="address">العنوان بالتفصيل <em>*</em></label>
                <textarea id="address" required placeholder="اسم الشارع، رقم العمارة، الدور، رقم الشقة، وأقرب علامة مميزة" autocomplete="street-address"></textarea>
              </div>
            </div>

            <div class="card">
              <h2><i class="fas fa-user"></i> 2. بيانات المستلم</h2>
              <div class="form">
                <label for="name">الاسم بالكامل <em>*</em></label>
                <input id="name" type="text" required autocomplete="name" placeholder="الاسم ثلاثي" />
                <div class="row2">
                  <div><label for="phone">رقم الموبايل <em>*</em></label><input id="phone" type="tel" inputmode="numeric" required dir="ltr" autocomplete="tel" placeholder="01xxxxxxxxx" /></div>
                  <div><label for="altPhone">رقم بديل (للتواصل لو الأول مقفول)</label><input id="altPhone" type="tel" inputmode="numeric" dir="ltr" placeholder="01xxxxxxxxx" /></div>
                </div>
                <label for="notes">ملاحظات إضافية (اختياري)</label>
                <textarea id="notes" placeholder="مثال: الاتصال قبل الوصول، أفضل وقت للتسليم بعد 5 مساءً..."></textarea>
              </div>
            </div>
          </div>

          <aside>
            <div class="card">
              <h2><i class="fas fa-file-invoice"></i> الفاتورة</h2>
              <ul class="inv-items" id="invItems"></ul>
              <div class="inv-row" style="border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px"><span>سعر المنتجات</span><b id="iSub">—</b></div>
              <div class="inv-row"><span>الشحن <small class="muted" id="iZone"></small></span><b id="iShip">اختَر المنطقة</b></div>
              <div class="inv-row total"><span>إجمالي الطلب</span><b id="iTotal">—</b></div>
              <div class="split">
                <div class="now"><small>تدفعه الآن بالتحويل</small><b id="iNow">—</b></div>
                <div class="later"><small>تدفعه للمندوب عند الاستلام</small><b id="iLater">—</b></div>
              </div>
              <p class="inv-row sub" id="iExplain" style="margin-top: 8px"></p>
              <label class="check"><input type="checkbox" id="agree" /><span>قرأت وأوافق على <a class="link" href="terms.html" target="_blank">الشروط والأحكام</a></span></label>
              <p class="err" id="coErr" role="alert"></p>
              <button class="btn primary block" type="submit" id="coBtn" disabled>تأكيد الطلب <i class="fas fa-arrow-left"></i></button>
              <p class="note"><i class="fas fa-shield-halved"></i><span data-t="pay_explain"></span></p>
            </div>
          </aside>
        </form>
      </div>
    </main>
    <script type="module" src="js/checkout.js"></script>
  </body>
</html>
