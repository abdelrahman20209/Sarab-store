<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex" />
    <title>تسجيل الدخول | سراب</title>
    <link rel="icon" type="image/png" href="img/LOGO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/store.css" />
  </head>
  <body data-page="login">
    <main class="auth">
      <div class="auth-side"><img data-img="auth_img" src="img/WhatsApp%20Image%202026-04-05%20at%207.17.17%20PM.jpeg" alt="" /><div><h2 data-t="auth_title"></h2><p data-t="auth_text"></p></div></div>
      <div class="auth-box">
        <h1>تسجيل الدخول</h1>
        <p class="muted">ادخل بحسابك لمتابعة طلبك.</p>
        <form class="form" id="loginForm" style="margin-top: 14px">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" type="email" inputmode="email" autocomplete="username" required dir="ltr" placeholder="name@example.com" />
          <label for="password">كلمة المرور</label>
          <div class="pass"><input id="password" type="password" autocomplete="current-password" required dir="ltr" /><button type="button" data-eye aria-label="إظهار كلمة المرور"><i class="far fa-eye"></i></button></div>
          <a class="link" href="forgot.html" style="font-size: 0.88rem; justify-self: start; margin-top: 4px">نسيت كلمة المرور؟</a>
          <p class="err" id="err" role="alert"></p>
          <button class="btn primary block" type="submit" id="submitBtn">دخول <i class="fas fa-arrow-left"></i></button>
        </form>
        <p class="alt">أول مرة تطلب من سراب؟ <a class="link" id="toSignup" href="signup.html">أنشئ حساب جديد</a></p>
      </div>
    </main>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
