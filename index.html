<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>سراب | Sarab — عطور فاخرة</title>
    <meta name="description" content="سراب — عطور فاخرة. اطلب بسهولة: ادفع مقدّماً بسيطاً بالتحويل واستلم طلبك وادفع الباقي للمندوب." />
    <link rel="icon" type="image/png" href="img/LOGO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/store.css" />
  </head>
  <body>
    <main>
      <!-- الواجهة -->
      <section class="hero">
        <div class="wrap hero-in">
          <div>
            <div class="kicker" data-t="hero_eyebrow"></div>
            <h1><span data-t="hero_title_a"></span> <em data-t="hero_title_em"></em><br /><span data-t="hero_title_b"></span></h1>
            <p class="lead" data-t="hero_lead"></p>
            <div class="hero-btns">
              <a class="btn primary" href="#shop"><span data-t="hero_btn1"></span> <i class="fas fa-arrow-left"></i></a>
              <a class="btn ghost" href="#how" data-t="hero_btn2"></a>
            </div>
            <ul class="points">
              <li><i class="fas fa-truck-fast"></i> <span data-t="hero_point1"></span></li>
              <li><i class="fas fa-hand-holding-dollar"></i> <span data-t="hero_point2"></span></li>
              <li><i class="fab fa-whatsapp"></i> <span data-t="hero_point3"></span></li>
            </ul>
          </div>
          <div class="arches" aria-hidden="true">
            <figure><img data-img="hero_img3" src="img/WhatsApp%20Image%202026-04-05%20at%207.16.15%20PM.jpeg" alt="" /></figure>
            <figure><img data-img="hero_img1" src="img/WhatsApp%20Image%202026-04-05%20at%207.17.17%20PM.jpeg" alt="" /></figure>
            <figure><img data-img="hero_img2" src="img/WhatsApp%20Image%202026-04-05%20at%207.18.11%20PM.jpeg" alt="" /></figure>
          </div>
        </div>
      </section>

      <!-- خطوات الطلب -->
      <section class="sec how" id="how">
        <div class="wrap">
          <div class="sec-head center"><div class="kicker" data-t="how_kicker"></div><h2 data-t="how_title"></h2></div>
          <ol class="steps">
            <li class="step"><div><h3 data-t="how1_t"></h3><p data-t="how1_d"></p></div></li>
            <li class="step"><div><h3 data-t="how2_t"></h3><p data-t="how2_d"></p></div></li>
            <li class="step"><div><h3 data-t="how3_t"></h3><p data-t="how3_d"></p></div></li>
            <li class="step"><div><h3 data-t="how4_t"></h3><p data-t="how4_d"></p></div></li>
          </ol>
        </div>
      </section>

      <!-- الأقسام (تتولد تلقائياً من لوحة التحكم) -->
      <section class="sec" id="sections" hidden>
        <div class="wrap">
          <div class="sec-head"><div class="kicker" data-t="cat_kicker"></div><h2 data-t="cat_title"></h2></div>
          <div class="tiles" id="tiles"></div>
        </div>
      </section>

      <!-- صفوف الأقسام -->
      <div id="rails"></div>

      <!-- كل العطور -->
      <section class="sec" id="shop">
        <div class="wrap">
          <div class="sec-head"><div class="kicker" data-t="col_kicker"></div><h2 data-t="col_title"></h2></div>
          <div class="shop-tools">
            <div class="search"><i class="fas fa-magnifying-glass"></i><input id="q" type="search" data-ph="search_placeholder" aria-label="بحث" autocomplete="off" /></div>
            <div class="chips" id="chips" role="tablist"></div>
          </div>
          <div class="grid" id="grid">
            <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
          </div>
        </div>
      </section>

      <!-- الحكاية -->
      <section class="sec">
        <div class="wrap">
          <div class="story">
            <img data-img="story_img" src="img/WhatsApp%20Image%202026-04-05%20at%207.18.11%20PM.jpeg" alt="" loading="lazy" />
            <div><h2 data-t="story_title"></h2><p data-t="story_text" style="margin-top: 10px"></p></div>
          </div>
          <div class="values">
            <div class="value"><i class="fas fa-gem"></i><h3 data-t="val1_title"></h3><p data-t="val1_text"></p></div>
            <div class="value"><i class="fas fa-gift"></i><h3 data-t="val2_title"></h3><p data-t="val2_text"></p></div>
            <div class="value"><i class="fas fa-headset"></i><h3 data-t="val3_title"></h3><p data-t="val3_text"></p></div>
          </div>
        </div>
      </section>

      <section class="wrap">
        <div class="cta">
          <h2 data-t="cta_title"></h2>
          <p data-t="cta_text"></p>
          <a class="btn wa" data-wa target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> <span data-t="cta_btn"></span></a>
        </div>
      </section>
    </main>

    <!-- نافذة تفاصيل المنتج -->
    <section class="sheet" id="productSheet" aria-label="تفاصيل العطر">
      <button class="sheet-x" data-close aria-label="إغلاق"><i class="fas fa-xmark"></i></button>
      <div id="pv"></div>
    </section>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
