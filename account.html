<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex" />
    <title>حسابي | سراب</title>
    <link rel="icon" type="image/png" href="img/LOGO.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/store.css" />
  </head>
  <body>
    <main class="page">
      <div class="wrap" style="max-width: 860px">
        <div class="acc-hello">
          <div class="avatar" id="avatar">س</div>
          <div><h1 style="font-size: 1.4rem" id="hello">حسابي</h1><small class="muted ltr" id="helloEmail"></small></div>
        </div>

        <div class="acc-tabs" role="tablist">
          <button data-tab="orders" class="on"><i class="fas fa-box"></i> طلباتي</button>
          <button data-tab="profile"><i class="fas fa-user-pen"></i> بياناتي وعنواني</button>
          <button data-tab="security"><i class="fas fa-lock"></i> الأمان</button>
        </div>

        <section id="tab-orders">
          <div id="ordersList"><div class="card"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>جاري تحميل طلباتك...</p></div></div></div>
        </section>

        <section id="tab-profile" hidden>
          <form class="card form" id="profileForm">
            <h2><i class="fas fa-user"></i> بياناتي</h2>
            <label for="pName">الاسم بالكامل</label>
            <input id="pName" type="text" autocomplete="name" required />
            <div class="row2">
              <div><label for="pPhone">رقم الموبايل</label><input id="pPhone" type="tel" inputmode="numeric" dir="ltr" autocomplete="tel" placeholder="01xxxxxxxxx" /></div>
              <div><label for="pAlt">رقم بديل</label><input id="pAlt" type="tel" inputmode="numeric" dir="ltr" placeholder="01xxxxxxxxx" /></div>
            </div>
            <h2 style="margin-top: 18px"><i class="fas fa-location-dot"></i> عنوان التوصيل</h2>
            <label for="pZone">المنطقة</label>
            <select id="pZone"><option value="">— اختَر المنطقة —</option></select>
            <p class="note"><i class="fas fa-circle-info"></i><span data-t="zone_note"></span></p>
            <label for="pAddress">العنوان بالتفصيل</label>
            <textarea id="pAddress" placeholder="اسم الشارع، رقم العمارة، الدور، رقم الشقة، وأقرب علامة مميزة"></textarea>
            <label class="check"><input type="checkbox" id="pMarketing" /><span>أوافق على استلام العروض والخصومات على بريدي الإلكتروني</span></label>
            <p class="err" id="pErr" role="alert"></p>
            <button class="btn primary" type="submit" id="pSave"><i class="fas fa-floppy-disk"></i> حفظ البيانات</button>
          </form>
        </section>

        <section id="tab-security" hidden>
          <div class="card">
            <h2><i class="fas fa-key"></i> كلمة المرور</h2>
            <p class="muted">هنبعت لك رابط على بريدك الإلكتروني لتغيير كلمة المرور.</p>
            <button class="btn ghost" id="resetBtn" style="margin-top: 12px"><i class="far fa-envelope"></i> إرسال رابط تغيير كلمة المرور</button>
          </div>
          <div class="card">
            <h2><i class="fas fa-right-from-bracket"></i> تسجيل الخروج</h2>
            <p class="muted">سلتك هتفضل محفوظة على الجهاز ده.</p>
            <button class="btn ghost" id="logoutBtn" style="margin-top: 12px"><i class="fas fa-right-from-bracket"></i> تسجيل الخروج</button>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="js/account.js"></script>
  </body>
</html>
